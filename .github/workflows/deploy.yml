name: deploy

# One button: Actions → deploy → Run workflow. Builds every image at the
# chosen commit (default: HEAD of main), pushes them to GHCR, ships
# deploy/compose.yml, deploy/Caddyfile, deploy/server.sh and the task catalog
# to /opt/tolerance, then runs `server.sh deploy <sha>` there: DB dump,
# migrations, api/web swap, health check, automatic return to the previous
# tag if the new one is unhealthy. Rollback by hand = run it again with an
# older sha in `ref`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy (empty = main)
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/artur-gavronchuk

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: resolve sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-backend:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            API_URL=http://api:8080
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.ARENA_CONTACT_EMAIL }}
          tags: ${{ env.REGISTRY }}/tolerance-web:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: bot runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/internal/games/match/runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-bot-runtime:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=bot-runtime
          cache-to: type=gha,mode=max,scope=bot-runtime

      - name: go sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/fixtures/skills/go
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-skill-go:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=skill-go
          cache-to: type=gha,mode=max,scope=skill-go

      - name: python sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/fixtures/skills/python
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-skill-python:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=skill-python
          cache-to: type=gha,mode=max,scope=skill-python

      - name: site sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/internal/builds/site
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tolerance-site:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      # The real daily tasks live in the private repo arena-tasks; with its
      # deploy key set they replace the practice tasks from backend/fixtures.
      - name: private task catalog
        id: tasks
        env:
          KEY: ${{ secrets.ARENA_TASKS_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.tasks.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: artur-gavronchuk/arena-tasks
          ssh-key: ${{ secrets.ARENA_TASKS_DEPLOY_KEY }}
          path: arena-tasks

      - name: set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config

      - name: ship config and tasks
        run: |
          set -euo pipefail
          skills=backend/fixtures/skills
          [ "${{ steps.tasks.outputs.present }}" = "true" ] && skills=arena-tasks/skills
          # --inplace: compose.yml and Caddyfile are single-file bind mounts,
          # a new inode would leave containers on the old content.
          rsync -c --inplace deploy/compose.yml deploy/Caddyfile deploy/server.sh prod:/opt/tolerance/
          rsync -ac --delete --chmod=a+rX "$skills/" prod:/opt/tolerance/skills/

      - name: deploy on the server
        run: ssh prod "bash /opt/tolerance/server.sh deploy ${{ steps.sha.outputs.sha }}"

      - name: purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -c '{success, errors}'

      - name: public check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://tolerance.cc/api/v1/healthz && curl -fsS -o /dev/null https://tolerance.cc/; then
              echo "https://tolerance.cc is up at ${{ steps.sha.outputs.sha }}"; exit 0
            fi
            sleep 3
          done
          echo "https://tolerance.cc did not answer" >&2; exit 1
