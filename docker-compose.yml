# Local stack: `make up` (or `docker compose up --build`) → site on
# :${WEB_PORT}, api on :${API_PORT}. `migrate` runs goose + catalog sync once
# and exits; `api` is one process serving HTTP and running
# the submissions and tanks workers, so it needs docker.sock for the
# sandbox and bot containers.
#
# The production stack (Caddy, canary, monitoring, backups, deploy scripts)
# was cut for prototype mode; it lives at git tag ops-snapshot-2026-10-03.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena
    volumes:
      - arena-postgres-data:/var/lib/postgresql/data
    ports:
      # For native `make dev`; change PG_PORT if another stack holds 5432.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_migrate -d arena"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: ./backend
    image: tolerance-backend:local
    command: ["migrate"]
    restart: "no"
    environment:
      ARENA_MIGRATE_DATABASE_URL: postgres://arena_migrate:${POSTGRES_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_APP_ROLE_PASSWORD: ${ARENA_APP_ROLE_PASSWORD}
      # The image carries fixtures/proofs (ARENA_PROOFS_DIR); the language catalog is mounted here, and
      # ARENA_SKILLS_SOURCE can point it at the private arena-tasks repo.
      ARENA_SKILLS_DIR: /opt/arena/skills
    volumes:
      - ${ARENA_SKILLS_SOURCE:-./backend/fixtures/skills}:/opt/arena/skills:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: tolerance-backend:local
    restart: unless-stopped
    environment:
      ARENA_ADDR: 0.0.0.0:8080
      ARENA_ALLOW_NON_LOOPBACK: "true"
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_APP_ROLE_PASSWORD: ${ARENA_APP_ROLE_PASSWORD}
      ARENA_SANDBOX: ${ARENA_SANDBOX:-docker}
      ARENA_ADMIN_EMAILS: ${ARENA_ADMIN_EMAILS:-}
      ARENA_DEV_LOGIN: ${ARENA_DEV_LOGIN:-true}
      ARENA_NO_LIMITS: ${ARENA_NO_LIMITS:-true}
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:-http://localhost:3000}
      ARENA_GITHUB_CLIENT_ID: ${ARENA_GITHUB_CLIENT_ID:-}
      ARENA_GITHUB_CLIENT_SECRET: ${ARENA_GITHUB_CLIENT_SECRET:-}
      ARENA_GOOGLE_CLIENT_ID: ${ARENA_GOOGLE_CLIENT_ID:-}
      ARENA_GOOGLE_CLIENT_SECRET: ${ARENA_GOOGLE_CLIENT_SECRET:-}
      ARENA_MATCH_INTERVAL: ${ARENA_MATCH_INTERVAL:-20s}
    # The image runs as a non-root user; this is the group that owns
    # docker.sock (detected by `make up`, see DOCKER_GID in the Makefile).
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    # API_URL is baked into the Next build (rewrites land in the routes
    # manifest), so it has to be a build arg.
    build:
      context: ./frontend
      args:
        API_URL: http://api:8080
    image: tolerance-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  arena-postgres-data:
