# The whole Agent Arena on one machine: `make up` (local) or the same file
# on a VPS with a different .env. Ports are published to the host loopback
# only; a reverse proxy (Caddy/nginx) with TLS goes in front on a server.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena
    volumes:
      - arena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_migrate -d arena"]
      interval: 2s
      timeout: 2s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ${ARENA_DEX_CONFIG:-./backend/dev/dex/config.yaml}:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:${DEX_PORT:-5556}:5556"

  api:
    build: ./backend
    environment:
      ARENA_ADDR: 0.0.0.0:8080
      ARENA_ALLOW_NON_LOOPBACK: "true"
      ARENA_APP_DATABASE_URL: postgres://arena_app:${ARENA_APP_ROLE_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_MIGRATE_DATABASE_URL: postgres://arena_migrate:${POSTGRES_PASSWORD}@postgres:5432/arena?sslmode=disable
      ARENA_APP_ROLE_PASSWORD: ${ARENA_APP_ROLE_PASSWORD}
      ARENA_WEB_ORIGIN: ${ARENA_WEB_ORIGIN:-http://localhost:3000}
      ARENA_PUBLIC_WEB_URL: ${ARENA_WEB_ORIGIN:-http://localhost:3000}
      ARENA_OIDC_ISSUER: ${ARENA_OIDC_ISSUER:-http://localhost:5556/dex}
      ARENA_OIDC_JWKS_URL: ${ARENA_OIDC_JWKS_URL:-http://dex:5556/dex/keys}
      ARENA_OIDC_AUDIENCE: arena-web
      ARENA_ADMIN_EMAILS: ${ARENA_ADMIN_EMAILS:-admin@arena.local}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  arena-postgres-data:
