openapi: 3.1.0
info:
  title: FORGE API — slice 1 (contract and access)
  version: "0.1.0"
  description: >
    Covers only the routes implemented in slice 1: identity, campaigns,
    missions and budget limits. Submissions, evaluation, acceptance,
    execution and publication are added in later slices; see
    ../../docs/domain-and-api.md for the full target API and
    ../../docs/plans/slice-1-contract-and-access.md for what this file
    intentionally leaves out.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /me:
    get:
      summary: Current user and their organization memberships
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"

  /organizations:
    post:
      summary: Create an organization; the caller becomes its owner
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "422": { $ref: "#/components/responses/Problem" }

  /campaigns:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      summary: Create a campaign
      operationId: createCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCampaignInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      summary: List campaigns visible to the caller's organization
      operationId: listCampaigns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campaign" }

  /campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Get a campaign
      operationId: getCampaign
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: draft → active
      operationId: activateCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: active|finalizing → completed
      operationId: completeCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: draft|active|finalizing → cancelled
      operationId: cancelCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExpectedVersionInput"
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/budget:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: Set the campaign's spending limit (no reservations in slice 1)
      operationId: setCampaignBudget
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, limit_minor]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                limit_minor: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
    get:
      summary: Get the campaign's spending limit
      operationId: getCampaignBudget
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{campaignId}/missions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: campaignId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Create a mission (draft, with its first — and in slice 1, only — contract version)
      operationId: createMission
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMissionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "422": { $ref: "#/components/responses/Problem" }

  /missions/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Get a mission with its current contract version and requirements
      operationId: getMission
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "404": { $ref: "#/components/responses/Problem" }

  /missions/{id}/confirm-calibration:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: >
        draft → calibrating. Slice 1 stand-in for scenario-based
        calibration: an organizer's explicit confirmation, not yet a real
        evaluator run (see docs/plans/slice-1-contract-and-access.md).
      operationId: confirmMissionCalibration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "409": { $ref: "#/components/responses/Problem" }

  /missions/{id}/open:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PathId"
    post:
      summary: calibrating → open. Freezes the contract and computes its digest.
      operationId: openMission
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token, verified against the configured provider's JWKS.

  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      schema: { type: string }
      description: The active organization; the caller must have an active membership in it.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              code: { type: string }

    ExpectedVersionInput:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        display_name: { type: string }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    Membership:
      type: object
      properties:
        organization_id: { type: string }
        organization_name: { type: string }
        role:
          type: string
          enum: [owner, organizer, participant, evaluator, arbiter, viewer]

    CreateCampaignInput:
      type: object
      required: [name, mode, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mode: { type: string, enum: [public_season, private_trial] }
        currency: { type: string, minLength: 3, maxLength: 3 }

    Campaign:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        mode: { type: string, enum: [public_season, private_trial] }
        publication_policy: { type: object }
        currency: { type: string }
        state: { type: string, enum: [draft, active, finalizing, completed, cancelled] }
        version: { type: integer }
        created_at: { type: string, format: date-time }

    Budget:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        scope_kind: { type: string, enum: [campaign, entry, organizer_reserve] }
        scope_id: { type: string }
        currency: { type: string }
        limit_minor: { type: integer }
        version: { type: integer }

    RequirementInput:
      type: object
      required: [stable_key, gate, category, text]
      properties:
        stable_key: { type: string, minLength: 1, maxLength: 64 }
        gate: { type: boolean }
        weight: { type: integer }
        category: { type: string, minLength: 1, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 2000 }

    CreateMissionInput:
      type: object
      required: [stage, title, brief, deadline, requirements]
      properties:
        stage: { type: string, enum: [qualification, build, adapt, handoff] }
        title: { type: string, minLength: 1, maxLength: 200 }
        brief: { type: string, minLength: 1, maxLength: 10000 }
        deadline: { type: string, format: date-time }
        requirements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RequirementInput" }

    Requirement:
      type: object
      properties:
        id: { type: string }
        mission_version_id: { type: string }
        stable_key: { type: string }
        revision: { type: integer }
        gate: { type: boolean }
        weight: { type: integer }
        category: { type: string }
        text: { type: string }

    MissionVersion:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        mission_id: { type: string }
        number: { type: integer }
        parent_version_id: { type: [string, "null"] }
        contract: { type: object }
        contract_digest: { type: [string, "null"] }
        calibration_confirmed_at: { type: [string, "null"], format: date-time }
        calibration_confirmed_by: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date-time }
        submission_deadline: { type: [string, "null"], format: date-time }
        appeal_deadline: { type: [string, "null"], format: date-time }
        policies: { type: object }
        version: { type: integer }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/Requirement" }

    Mission:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        campaign_id: { type: string }
        stage: { type: string, enum: [qualification, build, adapt, handoff] }
        ordinal: { type: integer }
        state:
          type: string
          enum: [draft, calibrating, open, submission_closed, evaluating,
                 provisional, appeals_open, finalized, cancelled, invalidated]
        active_version_id: { type: [string, "null"] }
        version: { type: integer }
        current_version: { $ref: "#/components/schemas/MissionVersion" }
