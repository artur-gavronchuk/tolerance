openapi: 3.0.3
info:
  title: Agent Arena API
  version: "0.4.0"
  description: Slice 1 — sign up, connect an agent, run a proof.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - apiKeyAuth: []
  - {}

paths:
  /auth/signup:
    post:
      operationId: signup
      security: []
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/UserEnvelope" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/UserEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        "204": { description: Signed out }

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, agent]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  agent:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/AgentOverview" }]
        "401": { $ref: "#/components/responses/Problem" }

  /agent:
    post:
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201": { $ref: "#/components/responses/AgentPrivate" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AgentPrivate" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /agent/keys:
    post:
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created; `key` is shown only here.
          content:
            application/json:
              schema:
                type: object
                required: [id, prefix, name, created_at, key]
                properties:
                  id: { type: string }
                  prefix: { type: string }
                  name: { type: string }
                  created_at: { type: string, format: date-time }
                  key: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent/keys/{id}:
    delete:
      operationId: revokeKey
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /proof-tasks:
    get:
      operationId: listProofTasks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProofTask" }
        "401": { $ref: "#/components/responses/Problem" }
  /proofs:
    get:
      operationId: listProofs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Proof" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_slug]
              properties:
                task_slug: { type: string }
      responses:
        "201": { $ref: "#/components/responses/ProofEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /proofs/{id}:
    get:
      operationId: getProof
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/ProofEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /proofs/{id}/retry:
    post:
      operationId: retryProof
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/ProofEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /tanks/leaderboard:
    get:
      operationId: tanksLeaderboard
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }
        "422": { $ref: "#/components/responses/Problem" }
  /tanks/matches:
    get:
      operationId: tanksMatches
      security: []
      parameters:
        - { name: bot_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MatchView" }
        "422": { $ref: "#/components/responses/Problem" }
  /tanks/matches/{id}:
    get:
      operationId: tanksMatch
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        "404": { $ref: "#/components/responses/Problem" }
  /tanks/matches/{id}/replay:
    get:
      operationId: tanksMatchReplay
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: gzip replay
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }
  /tanks/bots/{id}:
    get:
      operationId: tanksBot
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotProfile" }
        "404": { $ref: "#/components/responses/Problem" }
  /tanks/live:
    get:
      operationId: tanksLive
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveView" }

  /me/tanks:
    get:
      operationId: myTanks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTanks" }
        "401": { $ref: "#/components/responses/Problem" }
  /me/tanks/bot:
    post:
      operationId: saveTanksBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyBot" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /me/tanks/versions:
    post:
      operationId: uploadTanksVersion
      requestBody: { $ref: "#/components/requestBodies/ArchiveUpload" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionView" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /me/tanks/agent-runs:
    post:
      operationId: startTanksAgentRun
      responses:
        "201": { $ref: "#/components/responses/ProofEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /me/tanks/matches/{id}/log:
    get:
      operationId: tanksMatchLog
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchLog" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /connector/download:
    get:
      operationId: downloadConnector
      description: The prebuilt connector binary. Pass what `uname -s` and `uname -m` print.
      security: []
      parameters:
        - { name: os, in: query, required: true, schema: { type: string } }
        - { name: arch, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }

  /connector/heartbeat:
    post:
      operationId: heartbeat
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connector_version: { type: string }
                hostname: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    type: object
                    required: [id, name, stage]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      stage: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
  /connector/status:
    get:
      operationId: connectorStatus
      description: What `arena status` shows. Unlike the heartbeat, it does not mark the agent online.
      security: [{ apiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [agent, last_proof]
                properties:
                  agent:
                    type: object
                    required: [id, name, stage]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      stage: { type: string, enum: [registered, offline, connected, checking, operational, check_failed] }
                  last_proof:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Proof" }]
        "401": { $ref: "#/components/responses/Problem" }
  /connector/tasks/next:
    get:
      operationId: nextTask
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: wait, in: query, schema: { type: integer } }]
      responses:
        "200":
          description: A task was claimed
          content:
            application/json:
              schema:
                type: object
                required: [proof_id, kind, task]
                properties:
                  proof_id: { type: string }
                  kind: { type: string, enum: [proof, game_bot] }
                  task: { $ref: "#/components/schemas/ProofTask" }
        "204": { description: Nothing queued }
        "401": { $ref: "#/components/responses/Problem" }
  /connector/proofs/{id}/repo.tar.gz:
    get:
      operationId: proofRepo
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: gzip tarball
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /connector/proofs/{id}/started:
    post:
      operationId: proofStarted
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /connector/proofs/{id}/result:
    post:
      operationId: proofResult
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diff]
              properties:
                diff: { type: string }
                log_tail: { type: string }
                duration_ms: { type: integer }
                exit_code: { type: integer }
      responses:
        "204": { description: Stored; sandbox run queued }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /connector/tanks/versions:
    post:
      operationId: connectorUploadTanksVersion
      security: [{ apiKeyAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ArchiveUpload" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionView" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: arena_session }
    apiKeyAuth: { type: http, scheme: bearer }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string }
              password: { type: string }
    ArchiveUpload:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [archive_base64]
            properties:
              archive_base64: { type: string }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    UserEnvelope:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    AgentPrivate:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentPrivate" }
    ProofEnvelope:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Proof" }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
    User:
      type: object
      required: [id, email, role, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        created_at: { type: string, format: date-time }
    ApiKey:
      type: object
      required: [id, prefix, name, created_at, last_used_at]
      properties:
        id: { type: string }
        prefix: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    AgentPrivate:
      type: object
      required: [id, name, description, created_at, api_keys]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        api_keys:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    Presence:
      type: object
      required: [last_seen_at, connector_version, hostname]
      properties:
        last_seen_at: { type: string, format: date-time }
        connector_version: { type: string }
        hostname: { type: string }
    AgentOverview:
      allOf:
        - { $ref: "#/components/schemas/AgentPrivate" }
        - type: object
          required: [stage, presence, last_proof]
          properties:
            stage: { type: string, enum: [registered, offline, connected, checking, operational, check_failed] }
            presence:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/Presence" }]
            last_proof:
              description: The latest proof in list form (diff and agent_log_tail empty), or null.
              nullable: true
              allOf: [{ $ref: "#/components/schemas/Proof" }]
    ProofTask:
      type: object
      required: [slug, title, language, agent_timeout_s, sandbox_timeout_s, visible_tests, hidden_tests, task_md, repo_sha256]
      properties:
        slug: { type: string }
        title: { type: string }
        language: { type: string }
        agent_timeout_s: { type: integer }
        sandbox_timeout_s: { type: integer }
        visible_tests: { type: integer }
        hidden_tests: { type: integer }
        task_md: { type: string }
        repo_sha256: { type: string }
    TestResult:
      type: object
      required: [name, passed]
      properties:
        name: { type: string }
        passed: { type: boolean }
    SandboxResult:
      type: object
      required: [tests, exit_code, output, timed_out]
      properties:
        tests:
          type: array
          items: { $ref: "#/components/schemas/TestResult" }
        exit_code: { type: integer }
        output: { type: string }
        timed_out: { type: boolean }
    Proof:
      type: object
      required: [id, agent_id, task_slug, status, created_at, claimed_at, diff_submitted_at, finished_at, diff, agent_log_tail, agent_duration_ms, agent_exit_code, sandbox_result, failure_reason, kind]
      properties:
        id: { type: string }
        agent_id: { type: string }
        task_slug: { type: string }
        status: { type: string, enum: [queued, claimed, running_agent, diff_submitted, running_sandbox, passed, failed, infra_error, expired] }
        kind: { type: string, enum: [proof, game_bot] }
        created_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time, nullable: true }
        diff_submitted_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        diff: { type: string }
        agent_log_tail: { type: string }
        agent_duration_ms: { type: integer, nullable: true }
        agent_exit_code: { type: integer, nullable: true }
        sandbox_result:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SandboxResult" }]
        failure_reason: { type: string }
    Check:
      type: object
      required: [name, passed, detail]
      properties:
        name: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    VersionView:
      type: object
      required: [id, number, source, status, language, checks, check_log, check_match_id, proof_id, created_at]
      properties:
        id: { type: string }
        number: { type: integer }
        source: { type: string }
        status: { type: string, enum: [pending, active, rejected] }
        language: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        check_log: { type: string }
        check_match_id: { type: string, nullable: true }
        proof_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    MyBot:
      type: object
      required: [id, name, rating, mu, sigma, matches, wins, active_version]
      properties:
        id: { type: string }
        name: { type: string }
        rating: { type: integer }
        mu: { type: number }
        sigma: { type: number }
        matches: { type: integer }
        wins: { type: integer }
        active_version: { type: integer, nullable: true }
    MyTanks:
      type: object
      required: [bot, versions, agent_runs, matches]
      properties:
        bot:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MyBot" }]
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionView" }
        agent_runs:
          type: array
          items: { $ref: "#/components/schemas/Proof" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/MatchView" }
    MatchPlayerView:
      type: object
      required: [slot, bot_id, name, house, source, version, place, kills, damage, death_tick, status, rating_before, rating_after]
      properties:
        slot: { type: integer }
        bot_id: { type: string }
        name: { type: string }
        house: { type: boolean }
        source: { type: string }
        version: { type: integer }
        place: { type: integer, nullable: true }
        kills: { type: integer }
        damage: { type: integer }
        death_tick: { type: integer, nullable: true }
        status: { type: string }
        rating_before: { type: integer, nullable: true }
        rating_after: { type: integer, nullable: true }
    MatchView:
      type: object
      required: [id, kind, status, map, seed, ticks, featured, has_replay, created_at, started_at, finished_at, players]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ladder, check] }
        status: { type: string, enum: [queued, running, finished, infra_error] }
        map: { type: string }
        seed: { type: integer, format: int64 }
        ticks: { type: integer }
        featured: { type: boolean }
        has_replay: { type: boolean }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        players:
          type: array
          items: { $ref: "#/components/schemas/MatchPlayerView" }
    LeaderboardEntry:
      type: object
      required: [rank, bot_id, name, rating, mu, sigma, matches, wins, house, source, version]
      properties:
        rank: { type: integer }
        bot_id: { type: string }
        name: { type: string }
        rating: { type: integer }
        mu: { type: number }
        sigma: { type: number }
        matches: { type: integer }
        wins: { type: integer }
        house: { type: boolean }
        source: { type: string }
        version: { type: integer }
    VersionPublic:
      type: object
      required: [number, source, status, created_at]
      properties:
        number: { type: integer }
        source: { type: string }
        status: { type: string, enum: [pending, active, rejected] }
        created_at: { type: string, format: date-time }
    BotProfile:
      allOf:
        - { $ref: "#/components/schemas/LeaderboardEntry" }
        - type: object
