<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit converter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #222; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 16px; font-size: 28px; }
  select, input { width: 100%; min-width: 0; padding: 10px; font: inherit; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .eq { margin: 10px 0 0; color: #666; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Unit converter</h1>
  <select data-testid="category" aria-label="Category"></select>
  <div class="row">
    <input data-testid="from-value" inputmode="decimal" aria-label="From value" value="1">
    <select data-testid="from-unit" aria-label="From unit"></select>
    <input data-testid="to-value" inputmode="decimal" aria-label="To value">
    <select data-testid="to-unit" aria-label="To unit"></select>
  </div>
  <p class="eq" id="eq"></p>
</main>
<script>
  // Linear units: factor to the base unit. Temperature is handled separately (offsets).
  const U = {
    length: { m: ['Meters', 1], km: ['Kilometers', 1000], cm: ['Centimeters', 0.01], mi: ['Miles', 1609.344], ft: ['Feet', 0.3048], in: ['Inches', 0.0254] },
    mass: { kg: ['Kilograms', 1], g: ['Grams', 0.001], mg: ['Milligrams', 1e-6], lb: ['Pounds', 0.45359237], oz: ['Ounces', 0.028349523125] },
    volume: { l: ['Liters', 1], ml: ['Milliliters', 0.001], gal: ['US gallons', 3.785411784], cup: ['US cups (approx.)', 0.2365882365], floz: ['US fluid ounces', 0.0295735295625] },
    speed: { ms: ['Meters/second', 1], kmh: ['Kilometers/hour', 1 / 3.6], mph: ['Miles/hour', 0.44704], kn: ['Knots', 0.514444], fts: ['Feet/second', 0.3048] },
    temperature: { c: ['Celsius'], f: ['Fahrenheit'], k: ['Kelvin'] },
  };
  const toC = { c: (v) => v, f: (v) => (v - 32) * 5 / 9, k: (v) => v - 273.15 };
  const fromC = { c: (v) => v, f: (v) => v * 9 / 5 + 32, k: (v) => v + 273.15 };

  const $ = (id) => document.querySelector('[data-testid=' + id + ']');
  const cat = $('category'), fu = $('from-unit'), tu = $('to-unit'), fv = $('from-value'), tv = $('to-value');

  function convert(v, a, b) {
    if (cat.value === 'temperature') return fromC[b](toC[a](v));
    return v * U[cat.value][a][1] / U[cat.value][b][1];
  }
  const fmt = (n) => String(Number(n.toPrecision(10)));
  function parse(el) { const n = parseFloat(el.value.replace(',', '.')); return Number.isFinite(n) ? n : null; }

  function forward() { const n = parse(fv); tv.value = n === null ? '' : fmt(convert(n, fu.value, tu.value)); note(); }
  function backward() { const n = parse(tv); fv.value = n === null ? '' : fmt(convert(n, tu.value, fu.value)); note(); }
  function note() {
    const n = parse(fv);
    document.getElementById('eq').textContent = n === null ? '' : fmt(n) + ' ' + fu.value + ' = ' + tv.value + ' ' + tu.value;
  }
  function fill(sel, units, pick) {
    sel.textContent = '';
    for (const [code, [name]] of Object.entries(units)) sel.add(new Option(name, code));
    sel.value = pick;
  }
  function loadCategory() {
    const codes = Object.keys(U[cat.value]);
    fill(fu, U[cat.value], codes[0]);
    fill(tu, U[cat.value], codes[1]);
    forward();
  }
  for (const c of Object.keys(U)) cat.add(new Option(c[0].toUpperCase() + c.slice(1), c));
  cat.onchange = loadCategory;
  fu.onchange = tu.onchange = forward;
  fv.oninput = forward;
  tv.oninput = backward;
  loadCategory();
</script>
</body>
</html>
